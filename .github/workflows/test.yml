name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .
      - run: python3 tools/sync_skills.py --check
      - name: Skills meet the Agent Skills spec
        run: for d in skills/*/; do npx -y skills-ref@0.1.5 validate "$d" || exit 1; done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "mcp-server[dev]"
      - run: pytest mcp-server

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build mcp-server --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Built wheel starts and lists tools
        run: |
          uv venv /tmp/smoke && . /tmp/smoke/bin/activate
          uv pip install dist/*.whl
          DARAJA_CONSUMER_KEY=x DARAJA_CONSUMER_SECRET=y python -c "
          import asyncio
          from mpesa_mcp import server
          print(len(asyncio.run(server.server.list_tools())), 'tools')"

  install:
    # Runs the one-line installers on fresh machines without uv.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: |
          sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool list | grep mpesa-daraja-mcp
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv tool list | Select-String mpesa-daraja-mcp
