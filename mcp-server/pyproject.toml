[project]
name = "mpesa-daraja-mcp"
version = "0.1.0"
description = "MCP server for Safaricom M-Pesa Daraja: STK Push, C2B, B2C, B2B, status, balance, reversal, QR, Ratiba, Bill Manager"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mr-Macharia" }]
keywords = ["mpesa", "m-pesa", "daraja", "safaricom", "mcp", "model-context-protocol", "payments", "kenya"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/Mr-Macharia/Mpesa-MCP"
Repository = "https://github.com/Mr-Macharia/Mpesa-MCP"
Issues = "https://github.com/Mr-Macharia/Mpesa-MCP/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
# uvx runs the script named like the package; mpesa-mcp is kept for existing configs.
mpesa-daraja-mcp = "mpesa_mcp.server:main"
mpesa-mcp = "mpesa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpesa_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
