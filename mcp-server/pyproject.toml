[project]
name = "mpesa-daraja-mcp"
version = "0.1.5"
description = "M-Pesa Daraja toolkit: MCP server and `mpesa` CLI for STK Push, C2B, B2C, B2B, status, balance, reversal, QR, Ratiba, Bill Manager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mr-Macharia" }]
keywords = ["mpesa", "m-pesa", "daraja", "safaricom", "mcp", "model-context-protocol", "payments", "kenya"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "cryptography>=42", "typer>=0.12", "rich>=13", "questionary>=2"]

[project.urls]
Homepage = "https://github.com/Mr-Macharia/mpesa-daraja-skills-and-mcp"
Repository = "https://github.com/Mr-Macharia/mpesa-daraja-skills-and-mcp"
Issues = "https://github.com/Mr-Macharia/mpesa-daraja-skills-and-mcp/issues"
Changelog = "https://github.com/Mr-Macharia/mpesa-daraja-skills-and-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Mr-Macharia/mpesa-daraja-skills-and-mcp/blob/main/docs/clients.md"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.2"]
agno = ["agno>=2"]
google-adk = ["google-adk>=1.10"]
# CrewAI 1.7 and later pin mcp<2, so pip picks 1.6.x next to this package.
crewai = ["crewai>=1.6"]
# All five adapters, for the frameworks CI job.
frameworks = ["mpesa-daraja-mcp[langchain,openai-agents,agno,google-adk,crewai]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pyyaml>=6", "jsonschema>=4", "tomli>=2; python_version < '3.11'"]

[project.scripts]
# `mpesa` is the CLI. uvx runs the script named like the package, which starts the server when given
# no arguments. mpesa-daraja and mpesa-mcp are aliases kept for existing configs.
mpesa = "mpesa_mcp.commands:main"
mpesa-daraja-mcp = "mpesa_mcp.cli:entry"
mpesa-daraja = "mpesa_mcp.cli:entry"
mpesa-mcp = "mpesa_mcp.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpesa_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
