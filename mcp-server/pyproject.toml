[project]
name = "mpesa-mcp"
version = "0.1.0"
description = "MCP server exposing Safaricom M-Pesa Daraja APIs (STK Push, C2B, B2C, B2B, status, balance, reversal, QR, Ratiba, Bill Manager) as tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
mpesa-mcp = "mpesa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpesa_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
