# Compatibility package: `mpesa-daraja-mcp` was renamed `mpesa-daraja` in 0.1.5. This keeps
# `uvx mpesa-daraja-mcp` and existing agent configs working. The version tracks ../pyproject.toml.
[project]
name = "mpesa-daraja-mcp"
version = "0.1.4"
description = "Renamed to mpesa-daraja. Installs it and keeps the mpesa-daraja-mcp command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mr-Macharia" }]
dependencies = ["mpesa-daraja==0.1.4"]

[project.urls]
Homepage = "https://github.com/Mr-Macharia/mpesa-daraja-skills-and-mcp"

[project.scripts]
mpesa-daraja-mcp = "mpesa_mcp.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpesa_daraja_mcp"]
