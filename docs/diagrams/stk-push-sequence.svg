<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="1084" viewBox="0 0 1090 1084" role="img" aria-label="STK Push, from request to callback"><defs>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff3d00"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ea043"/><stop offset="1" stop-color="#14672a"/></linearGradient>
  <radialGradient id="halo" cx="0.85" cy="0" r="0.9"><stop offset="0" stop-color="#ff5a14" stop-opacity="0.22"/><stop offset="1" stop-color="#ff5a14" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.06"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  <marker id="arrow-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker><marker id="arrow-saf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56d364"/></marker><marker id="arrow-cust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b88b8"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a97b8"/></marker>
</defs><rect width="1090" height="1084" rx="24" fill="#0c0b1d"/><rect width="1090" height="1084" rx="24" fill="url(#dots)"/><rect width="1090" height="1084" rx="24" fill="url(#halo)"/><text x="40" y="54" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="start" letter-spacing="-0.3">STK Push, from request to callback</text><text x="40" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >The first response only means Daraja accepted the request. The callback says whether the customer paid.</text><circle cx="957.6" cy="47" r="5" fill="#8b88b8"/><text x="969.6" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Customer</text><circle cx="851.4" cy="47" r="5" fill="#56d364"/><text x="863.4" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Safaricom</text><circle cx="745.1999999999999" cy="47" r="5" fill="#ff9a4d"/><text x="757.1999999999999" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Your side</text><line x1="170" y1="192" x2="170" y2="1044" stroke="#ff5a14" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="75" y="134" width="190" height="58" rx="14" fill="url(#orange)" stroke="#ff9a4d" stroke-opacity="0.8"/></g><text x="170" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Your server</text><text x="170" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">starts checkout</text><line x1="420" y1="192" x2="420" y2="1044" stroke="#56d364" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="325" y="134" width="190" height="58" rx="14" fill="url(#green)" stroke="#56d364" stroke-opacity="0.8"/></g><text x="420" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Daraja API</text><text x="420" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">Safaricom gateway</text><line x1="670" y1="192" x2="670" y2="1044" stroke="#56d364" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="575" y="134" width="190" height="58" rx="14" fill="url(#green)" stroke="#56d364" stroke-opacity="0.8"/></g><text x="670" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >M-Pesa core</text><text x="670" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">moves the money</text><line x1="920" y1="192" x2="920" y2="1044" stroke="#8b88b8" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="825" y="134" width="190" height="58" rx="14" fill="#1c1b38" stroke="#4a4878" stroke-opacity="0.8"/></g><text x="920" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f4f2ff" text-anchor="middle" >Customer's phone</text><text x="920" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a97b8" text-anchor="middle" fill-opacity="0.8">SIM toolkit prompt</text><line x1="198" y1="222" x2="416" y2="222" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="184" cy="222" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="184" y="226.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >1</text><text x="303.0" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Send STK Push</text><text x="303.0" y="244" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ff9a4d" text-anchor="middle" >POST /mpesa/stkpush/v1/processrequest</text><line x1="392" y1="300" x2="174" y2="300" stroke="#56d364" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="406" cy="300" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="406" y="304.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >2</text><text x="287.0" y="288" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Accepted</text><text x="287.0" y="322" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#56d364" text-anchor="middle" >ResponseCode 0, CheckoutRequestID</text><g filter="url(#lift)"><rect x="60" y="360" width="470" height="68" rx="12" fill="#22140f" stroke="#5a2a12"/></g><rect x="60" y="360" width="5" height="68" rx="2.5" fill="url(#orange)"/><text x="84" y="384" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffd3b3" text-anchor="start" >Accepted is not paid.</text><text x="84" y="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffd3b3" text-anchor="start" >Save the CheckoutRequestID and mark the order pending.</text><line x1="448" y1="476" x2="666" y2="476" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="434" cy="476" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="434" y="480.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >3</text><text x="553.0" y="464" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Forward request</text><line x1="698" y1="540" x2="916" y2="540" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="684" cy="540" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="684" y="544.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >4</text><text x="803.0" y="528" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >PIN prompt</text><line x1="892" y1="604" x2="674" y2="604" stroke="#8b88b8" stroke-width="2.2" marker-end="url(#arrow-cust)"/><g filter="url(#glow)"><circle cx="906" cy="604" r="13" fill="#0c0b1d" stroke="#8b88b8" stroke-width="2"/></g><text x="906" y="608.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8b88b8" text-anchor="middle" >5</text><text x="787.0" y="592" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Enters PIN, or cancels</text><path d="M698,658 h46 v30 h-42" fill="none" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="684" cy="658" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="684" y="662.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >6</text><text x="758" y="670" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="start" >Debit and credit</text><line x1="642" y1="746" x2="424" y2="746" stroke="#56d364" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="656" cy="746" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="656" y="750.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >7</text><text x="537.0" y="734" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Final status</text><line x1="392" y1="810" x2="174" y2="810" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="406" cy="810" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="406" y="814.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >8</text><text x="287.0" y="798" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Callback</text><text x="287.0" y="832" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#56d364" text-anchor="middle" >POST to your CallBackURL</text><path d="M198,878 h46 v30 h-42" fill="none" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="184" cy="878" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="184" y="882.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >9</text><text x="258" y="890" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="start" >Match CheckoutRequestID</text><text x="258" y="909" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >update the order</text><line x1="198" y1="966" x2="416" y2="966" stroke="#ff5a14" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="184" cy="966" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="184" y="970.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >10</text><text x="303.0" y="954" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Acknowledge</text><text x="303.0" y="988" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ff9a4d" text-anchor="middle" >HTTP 200</text></svg>