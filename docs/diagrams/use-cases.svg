</defs><rect width="1280" height="640" rx="24" fill="#0c0b1d"/><rect width="1280" height="640" rx="24" fill="url(#dots)"/><rect width="1280" height="640" rx="24" fill="url(#halo)"/><text x="40" y="54" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="start" letter-spacing="-0.3">What you can do with it</text><text x="40" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >Build payment systems with a coding agent, or let an agent run payments for you.</text><rect x="40" y="112" width="580" height="440" rx="22" fill="#141329" stroke="#3a3860" stroke-opacity="1"/><rect x="68" y="136" width="96" height="36" rx="18" fill="none" stroke="#ff9a4d"/><text x="116.0" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ff9a4d" text-anchor="middle" >Build</text><text x="180" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >with the skills, in your codebase</text><g transform="translate(68,204)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h3l2.5 11h10l2-8H11"/><circle cx="13" cy="24" r="1.5"/><circle cx="21" cy="24" r="1.5"/></g></g><text x="116" y="218" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Checkout</text><text x="116" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >STK Push with a callback that marks orders paid</text><line x1="68" y1="258" x2="592" y2="258" stroke="#3a3860" stroke-opacity="0.6"/><g transform="translate(68,274)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16l16-7-5 16-3-6z"/><path d="M16 19l8-10"/></g></g><text x="116" y="288" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Payouts</text><text x="116" y="310" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >B2C and B2B jobs that never pay twice</text><line x1="68" y1="328" x2="592" y2="328" stroke="#3a3860" stroke-opacity="0.6"/><g transform="translate(68,344)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20V15a6 6 0 0 1 12 0v5l2 2H8z"/><path d="M14 25h4"/></g></g><text x="116" y="358" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Callback handlers</text><text x="116" y="380" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >idempotent, fast to acknowledge, keyed correctly</text><line x1="68" y1="398" x2="592" y2="398" stroke="#3a3860" stroke-opacity="0.6"/><g transform="translate(68,414)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="10" height="13" rx="5"/><path d="M16 11V8M8 15h3M21 15h3M8 21h3M21 21h3"/></g></g><text x="116" y="428" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Debugging</text><text x="116" y="450" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >decode 400.002.02, 1032 and friends in seconds</text><line x1="68" y1="468" x2="592" y2="468" stroke="#3a3860" stroke-opacity="0.6"/><g transform="translate(68,484)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6c4 3 5 8 4 13h-8c-1-5 0-10 4-13z"/><path d="M12 19l-3 4h4M20 19l3 4h-4"/><circle cx="16" cy="13" r="2"/></g></g><text x="116" y="498" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Go-live</text><text x="116" y="520" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >sandbox to production, credentials done right</text><rect x="660" y="112" width="580" height="440" rx="22" fill="#141329" stroke="#ff5a14" stroke-opacity="0.6"/><rect x="688" y="136" width="120" height="36" rx="18" fill="url(#orange)" stroke="#ff9a4d"/><text x="748.0" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" >Operate</text><text x="824" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >with the MCP server, from chat</text><g transform="translate(688,204)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-lineca