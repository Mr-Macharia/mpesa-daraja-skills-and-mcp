" text-anchor="start" >pull C2B transactions and match invoices</text><line x1="688" y1="398" x2="1212" y2="398" stroke="#3a3860" stroke-opacity="0.6"/><g transform="translate(688,414)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7v18M10 25h12M9 11h14"/><path d="M9 11l-3 7h6zM23 11l-3 7h6z"/></g></g><text x="736" y="428" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Treasury</text><text x="736" y="450" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >balances, transaction status, reversals</text><line x1="688" y1="468" x2="1212" y2="468" stroke="#3a3860" stroke-opacity="0.6"/><g transform="translate(688,484)"><rect width="32" height="32" rx="9" fill="#ff9a4d" fill-opacity="0.16"/><g fill="none" stroke="#ff9a4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13a7 7 0 0 1 12-3l2 2M23 19a7 7 0 0 1-12 3l-2-2"/><path d="M23 8v4h-4M9 24v-4h4"/></g></g><text x="736" y="498" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f2ff" text-anchor="start" >Billing</text><text x="736" y="520" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >Ratiba standing orders, Bill Manager invoices</text><text x="40" y="594" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >Also: KRA tax remittance, Dynamic QR at the till, simulated C2B payments for tests, and learning how Daraja works.</text></svg>