<svg xmlns="http://www.w3.org/2000/svg" width="940" height="992" viewBox="0 0 940 992" role="img" aria-label="Handling a callback safely"><defs>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff3d00"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ea043"/><stop offset="1" stop-color="#14672a"/></linearGradient>
  <radialGradient id="halo" cx="0.85" cy="0" r="0.9"><stop offset="0" stop-color="#ff5a14" stop-opacity="0.22"/><stop offset="1" stop-color="#ff5a14" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.06"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  <marker id="arrow-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker><marker id="arrow-saf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56d364"/></marker><marker id="arrow-cust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b88b8"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a97b8"/></marker>
</defs><rect width="940" height="992" rx="24" fill="#0c0b1d"/><rect width="940" height="992" rx="24" fill="url(#dots)"/><rect width="940" height="992" rx="24" fill="url(#halo)"/><text x="40" y="54" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="start" letter-spacing="-0.3">Handling a callback safely</text><text x="40" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >Callbacks can arrive twice, late, or never. Make the handler idempotent and fast.</text><circle cx="807.6" cy="47" r="5" fill="#8b88b8"/><text x="819.6" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Customer</text><circle cx="701.4" cy="47" r="5" fill="#56d364"/><text x="713.4" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Safaricom</text><circle cx="595.1999999999999" cy="47" r="5" fill="#ff9a4d"/><text x="607.1999999999999" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Your side</text><line x1="170" y1="192" x2="170" y2="952" stroke="#8b88b8" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="75" y="134" width="190" height="58" rx="14" fill="#1c1b38" stroke="#4a4878" stroke-opacity="0.8"/></g><text x="170" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f4f2ff" text-anchor="middle" >Customer</text><text x="170" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a97b8" text-anchor="middle" fill-opacity="0.8">pays on their phone</text><line x1="470" y1="192" x2="470" y2="952" stroke="#ff5a14" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="375" y="134" width="190" height="58" rx="14" fill="url(#orange)" stroke="#ff9a4d" stroke-opacity="0.8"/></g><text x="470" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Your server</text><text x="470" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">callback endpoint</text><line x1="770" y1="192" x2="770" y2="952" stroke="#56d364" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="675" y="134" width="190" height="58" rx="14" fill="url(#green)" stroke="#56d364" stroke-opacity="0.8"/></g><text x="770" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Safaricom</text><text x="770" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">Daraja + M-Pesa</text><line x1="198" y1="222" x2="466" y2="222" stroke="#8b88b8" stroke-width="2.2" marker-end="url(#arrow-cust)"/><g filter="url(#glow)"><circle cx="184" cy="222" r="13" fill="#0c0b1d" stroke="#8b88b8" stroke-width="2"/></g><text x="184" y="226.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8b88b8" text-anchor="middle" >1</text><text x="328.0" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Checks out</text><line x1="498" y1="286" x2="766" y2="286" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="484" cy="286" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="484" y="290.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >2</text><text x="628.0" y="274" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >STK Push request</text><line x1="742" y1="350" x2="174" y2="350" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="756" cy="350" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="756" y="354.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >3</text><text x="462.0" y="338" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >PIN prompt</text><line x1="198" y1="414" x2="766" y2="414" stroke="#8b88b8" stroke-width="2.2" marker-end="url(#arrow-cust)"/><g filter="url(#glow)"><circle cx="184" cy="414" r="13" fill="#0c0b1d" stroke="#8b88b8" stroke-width="2"/></g><text x="184" y="418.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8b88b8" text-anchor="middle" >4</text><text x="478.0" y="402" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Enters PIN</text><path d="M742,468 h-46 v30 h42" fill="none" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="756" cy="468" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="756" y="472.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >5</text><text x="682" y="480" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="end" >Processes payment</text><line x1="742" y1="556" x2="474" y2="556" stroke="#56d364" stroke-width="2.2" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="756" cy="556" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="756" y="560.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >6</text><text x="612.0" y="544" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Callback</text><text x="612.0" y="578" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#56d364" text-anchor="middle" >POST JSON to CallBackURL</text><path d="M498,624 h46 v30 h-42" fill="none" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="484" cy="624" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="484" y="628.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >7</text><text x="558" y="636" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="start" >Skip if already seen</text><text x="558" y="655" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >keyed on CheckoutRequestID</text><line x1="498" y1="712" x2="766" y2="712" stroke="#ff5a14" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="484" cy="712" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="484" y="716.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >8</text><text x="628.0" y="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Acknowledge within seconds</text><text x="628.0" y="734" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ff9a4d" text-anchor="middle" >HTTP 200</text><line x1="442" y1="790" x2="174" y2="790" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="456" cy="790" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="456" y="794.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >9</text><text x="312.0" y="778" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Confirms the order</text><g filter="url(#lift)"><rect x="360" y="836" width="520" height="68" rx="12" fill="#22140f" stroke="#5a2a12"/></g><rect x="360" y="836" width="5" height="68" rx="2.5" fill="url(#orange)"/><text x="384" y="860" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffd3b3" text-anchor="start" >No callback after a minute or two?</text><text x="384" y="881" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffd3b3" text-anchor="start" >Query the transaction status instead of sending the payment again.</text></svg>