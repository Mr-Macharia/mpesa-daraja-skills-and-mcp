<svg xmlns="http://www.w3.org/2000/svg" width="980" height="736" viewBox="0 0 980 736" role="img" aria-label="Getting a token, then calling the API"><defs>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff3d00"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ea043"/><stop offset="1" stop-color="#14672a"/></linearGradient>
  <radialGradient id="halo" cx="0.85" cy="0" r="0.9"><stop offset="0" stop-color="#ff5a14" stop-opacity="0.22"/><stop offset="1" stop-color="#ff5a14" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.06"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  <marker id="arrow-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker><marker id="arrow-saf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56d364"/></marker><marker id="arrow-cust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b88b8"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a97b8"/></marker>
</defs><rect width="980" height="736" rx="24" fill="#0c0b1d"/><rect width="980" height="736" rx="24" fill="url(#dots)"/><rect width="980" height="736" rx="24" fill="url(#halo)"/><text x="40" y="54" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f4f2ff" text-anchor="start" letter-spacing="-0.3">Getting a token, then calling the API</text><text x="40" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a97b8" text-anchor="start" >Every Daraja call needs a bearer token. Tokens last an hour, so cache one and reuse it.</text><circle cx="847.6" cy="47" r="5" fill="#8b88b8"/><text x="859.6" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Customer</text><circle cx="741.4" cy="47" r="5" fill="#56d364"/><text x="753.4" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Safaricom</text><circle cx="635.1999999999999" cy="47" r="5" fill="#ff9a4d"/><text x="647.1999999999999" y="52" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >Your side</text><line x1="170" y1="192" x2="170" y2="696" stroke="#ff5a14" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="75" y="134" width="190" height="58" rx="14" fill="url(#orange)" stroke="#ff9a4d" stroke-opacity="0.8"/></g><text x="170" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Your server</text><text x="170" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">holds key and secret</text><line x1="490" y1="192" x2="490" y2="696" stroke="#56d364" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="395" y="134" width="190" height="58" rx="14" fill="url(#green)" stroke="#56d364" stroke-opacity="0.8"/></g><text x="490" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Daraja OAuth</text><text x="490" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">issues tokens</text><line x1="810" y1="192" x2="810" y2="696" stroke="#56d364" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/><g filter="url(#lift)"><rect x="715" y="134" width="190" height="58" rx="14" fill="url(#green)" stroke="#56d364" stroke-opacity="0.8"/></g><text x="810" y="160" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" >Daraja API</text><text x="810" y="179" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" fill-opacity="0.8">STK Push, B2C, ...</text><line x1="198" y1="222" x2="486" y2="222" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="184" cy="222" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="184" y="226.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >1</text><text x="338.0" y="210" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Request a token</text><text x="338.0" y="244" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ff9a4d" text-anchor="middle" >GET /oauth/v1/generate?grant_type=client_credentials</text><g filter="url(#lift)"><rect x="60" y="282" width="540" height="68" rx="12" fill="#22140f" stroke="#5a2a12"/></g><rect x="60" y="282" width="5" height="68" rx="2.5" fill="url(#orange)"/><text x="84" y="306" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffd3b3" text-anchor="start" >Basic auth</text><text x="84" y="327" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffd3b3" text-anchor="start" >base64(ConsumerKey:ConsumerSecret) in the Authorization header</text><line x1="462" y1="398" x2="174" y2="398" stroke="#56d364" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="476" cy="398" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="476" y="402.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >2</text><text x="322.0" y="386" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Token</text><text x="322.0" y="420" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#56d364" text-anchor="middle" >access_token, expires_in 3599</text><path d="M198,466 h46 v30 h-42" fill="none" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="184" cy="466" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="184" y="470.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >3</text><text x="258" y="478" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="start" >Cache it</text><text x="258" y="497" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9a97b8" text-anchor="start" >refresh shortly before expiry</text><line x1="198" y1="554" x2="806" y2="554" stroke="#ff5a14" stroke-width="2.2" marker-end="url(#arrow-you)"/><g filter="url(#glow)"><circle cx="184" cy="554" r="13" fill="#0c0b1d" stroke="#ff5a14" stroke-width="2"/></g><text x="184" y="558.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ff5a14" text-anchor="middle" >4</text><text x="498.0" y="542" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Call the API</text><text x="498.0" y="576" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ff9a4d" text-anchor="middle" >Authorization: Bearer &lt;access_token&gt;</text><line x1="782" y1="632" x2="174" y2="632" stroke="#56d364" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-saf)"/><g filter="url(#glow)"><circle cx="796" cy="632" r="13" fill="#0c0b1d" stroke="#56d364" stroke-width="2"/></g><text x="796" y="636.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle" >5</text><text x="482.0" y="620" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#f4f2ff" text-anchor="middle" >Response</text></svg>